<!DOCTYPE html>
<html lang="fr" data-fr-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tableau croisé dynamique</title>
    <!-- Système de design de l'État (DSFR) : composants, icônes et police Marianne -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.3/dist/dsfr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.3/dist/utility/icons/icons.min.css">
    <!-- ?v= : version des fichiers du widget, à changer à chaque publication pour qu'un CDN (raw.githack…)
         ne serve jamais un mélange d'anciens et de nouveaux fichiers -->
    <link rel="stylesheet" href="styles.css?v=20261021-1">
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui-touch-punch/0.2.3/jquery.ui.touch-punch.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pivottable/2.23.0/pivot.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pivottable/2.23.0/pivot.fr.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/subtotal/1.11.0-alpha.0/subtotal.min.js"></script>
  </head>
  <body>
    <div id="app">

      <!-- Panneau de configuration, au-dessus du tableau : ouvert via « Ouvrir la configuration » dans le panneau Grist -->
      <aside id="config" aria-label="Configuration du tableau croisé" hidden>
        <div class="cfg-head">
          <!-- Titre du tableau, modifiable en place (facultatif) : barre de résumé et export Excel -->
          <div class="cfg-title">
            <div class="cfg-title-field">
              <label class="fr-sr-only" for="table-title">Titre du tableau</label>
              <input type="text" id="table-title" class="cfg-title-input" maxlength="200" autocomplete="off"
                     placeholder="Ajouter un titre au tableau" title="Titre affiché au-dessus du tableau et repris dans l'export Excel">
              <span class="cfg-title-edit fr-icon-edit-line fr-icon--sm" aria-hidden="true"></span>
            </div>
            <span id="save-state" class="save-state" aria-live="polite"></span>
          </div>
          <ul class="fr-btns-group fr-btns-group--inline fr-btns-group--sm fr-btns-group--right">
            <li><button type="button" id="cfg-revert" class="fr-btn fr-btn--secondary" title="Revenir à l'état d'ouverture de la configuration">Annuler</button></li>
            <li><button type="button" id="cfg-done" class="fr-btn">Terminer</button></li>
          </ul>
        </div>

        <!-- Trois colonnes : champs, disposition, affichage. Le tableau reste visible en dessous. -->
        <div class="cfg-body">
          <div class="cfg-col cfg-col--fields">
            <section class="cfg-section cfg-section--grow">
              <div class="cfg-section-head">
                <h3 class="cfg-heading">Champs disponibles</h3>
                <span id="field-count" class="fr-hint-text"></span>
              </div>
              <div class="fr-search-bar fr-search-bar--sm" role="search">
                <label class="fr-label" for="field-search">Rechercher un champ</label>
                <input class="fr-input" type="search" id="field-search" placeholder="Rechercher un champ" autocomplete="off">
              </div>
              <div id="slot-unused" class="slot"></div>
              <p class="fr-hint-text fr-mt-1w fr-mb-0">Glissez un champ vers Lignes ou Colonnes, ou cliquez dessus.</p>
            </section>
          </div>

          <div class="cfg-col">
            <section class="cfg-section">
              <div class="cfg-section-head">
                <h3 class="cfg-heading">Lignes</h3>
                <button type="button" id="swap-axes" class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm fr-icon-arrow-left-right-line" title="Inverser lignes et colonnes">Inverser lignes et colonnes</button>
              </div>
              <div id="slot-rows" class="slot"></div>
            </section>

            <section class="cfg-section">
              <div class="cfg-section-head">
                <h3 class="cfg-heading">Colonnes</h3>
              </div>
              <div id="slot-cols" class="slot"></div>
            </section>

            <section class="cfg-section">
              <div class="cfg-section-head">
                <h3 class="cfg-heading">Valeurs</h3>
              </div>
              <div id="slot-vals" class="slot-vals"></div>
            </section>

            <section class="cfg-section" id="filters-section">
              <div class="cfg-section-head">
                <h3 class="cfg-heading">Filtres actifs</h3>
                <button type="button" id="clear-filters" class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm">Tout effacer</button>
              </div>
              <div id="active-filters" class="filter-list"></div>
            </section>
          </div>

          <div class="cfg-col">
            <section class="cfg-section cfg-display">
              <h3 class="cfg-heading">Affichage</h3>

              <div id="renderer-seg"></div>

              <div class="fr-select-group" id="heat-scope-field">
                <label class="fr-label" for="heat-scope">Échelle de couleur</label>
                <select id="heat-scope" class="fr-select">
                  <option value="all">Sur tout le tableau</option>
                  <option value="row">Par ligne</option>
                  <option value="col">Par colonne</option>
                </select>
              </div>

              <div class="order-row">
                <div>
                  <p class="fr-label">Tri des lignes</p>
                  <span id="slot-row-order"></span>
                </div>
                <div>
                  <p class="fr-label">Tri des colonnes</p>
                  <span id="slot-col-order"></span>
                </div>
              </div>

              <div class="fr-toggle fr-toggle--label-left">
                <input type="checkbox" class="fr-toggle__input" id="row-totals">
                <label class="fr-toggle__label" for="row-totals">Total par ligne</label>
              </div>
              <div class="fr-toggle fr-toggle--label-left">
                <input type="checkbox" class="fr-toggle__input" id="col-totals">
                <label class="fr-toggle__label" for="col-totals">Total par colonne</label>
              </div>
              <div class="fr-toggle fr-toggle--label-left">
                <input type="checkbox" class="fr-toggle__input" id="subtotals" aria-describedby="subtotals-hint">
                <label class="fr-toggle__label" for="subtotals">Sous-totaux par groupe</label>
                <p class="fr-hint-text" id="subtotals-hint">Cliquez sur un groupe pour le replier.</p>
              </div>

              <div id="density-seg"></div>

              <div class="font-size">
                <p class="fr-label" id="font-size-label">Taille du texte</p>
                <div class="stepper" role="group" aria-labelledby="font-size-label">
                  <button type="button" id="font-down" class="fr-btn fr-btn--secondary fr-btn--sm" aria-label="Réduire le texte">A−</button>
                  <span id="font-value" aria-live="polite">100 %</span>
                  <button type="button" id="font-up" class="fr-btn fr-btn--secondary fr-btn--sm" aria-label="Agrandir le texte">A+</button>
                </div>
              </div>

            </section>
          </div>

          <div id="slot-renderer" hidden></div>
        </div>

        <!-- Poignée : partage de la hauteur entre la configuration et le tableau -->
        <div id="cfg-resizer" class="cfg-resizer" role="separator" aria-orientation="horizontal" aria-controls="config"
             aria-label="Hauteur de la configuration" aria-valuemin="200" tabindex="0"
             title="Glisser pour partager la hauteur avec le tableau (double-clic : hauteur par défaut)"></div>
      </aside>

      <!-- Barre de consultation -->
      <header id="viewbar">
        <div id="summary" class="summary"></div>
        <div class="viewbar-actions">
          <button type="button" id="btn-export" class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm fr-icon-download-line fr-btn--icon-left" aria-haspopup="true">Exporter</button>
        </div>
      </header>

      <main id="stage">
        <!-- Tableau du DSFR : pivotUI y rend son tableau (cellule pvtRendererArea, placée dans fr-table__container) -->
        <div id="output" class="output fr-table fr-table--sm fr-table--bordered fr-table--no-caption" tabindex="0">
          <div class="fr-table__wrapper">
            <div class="fr-table__container" id="table-scroll"></div>
          </div>
        </div>
      </main>

      <div id="filter-layer"></div>
      <div id="popover" class="popover" hidden></div>
      <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </div>

    <script src="ui.js?v=20261021-1"></script>
    <script src="gristColumns.js?v=20261021-1"></script>
    <script src="data.js?v=20261021-1"></script>
    <script src="aggregators.js?v=20261021-1"></script>
    <script src="render.js?v=20261021-1"></script>
    <script src="export.js?v=20261021-1"></script>
    <script src="config.js?v=20261021-1"></script>
    <script src="index.js?v=20261021-1"></script>
  </body>
</html>
